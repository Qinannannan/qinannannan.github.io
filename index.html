<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的可爱小窝 🌸</title>
    <style>
        /* 全局可爱风 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", "Comic Sans MS", cursive;
            background: linear-gradient(120deg, #fff0f6, #f0f9ff);
            color: #444;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }
        h1 {
            text-align: center;
            color: #ff7b9c;
            margin: 20px 0;
            font-size: 28px;
            text-shadow: 1px 1px 3px #ffd6e0;
        }
        /* 可爱卡片 */
        .card {
            background: #fff;
            border-radius: 20px;
            padding: 25px;
            margin: 20px 0;
            box-shadow: 0 4px 12px rgba(255, 123, 156, 0.15);
            border: 2px solid #ffe6ee;
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        h2 {
            color: #ff87ab;
            margin-bottom: 15px;
            font-size: 22px;
            border-bottom: 2px dotted #ffc9d8;
            padding-bottom: 5px;
        }
        p {
            line-height: 1.7;
            margin: 10px 0;
        }
        /* 图片样式：圆润+阴影 */
        img {
            max-width: 100%;
            border-radius: 16px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            margin: 12px 0;
        }
        /* 小装饰 */
        .emoji {
            margin-right: 6px;
        }

        /* 闪烁星星背景 */
        .star {
            position: fixed;
            top: 0;
            color: #ffd700;
            font-size: 12px;
            animation: twinkle 2s infinite ease-in-out;
            pointer-events: none;
            z-index: 1;
        }
        @keyframes twinkle {
            0%,100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* 樱花飘落 */
        .petal {
            position: fixed;
            top: -10px;
            color: #ffc0cb;
            font-size: 18px;
            animation: fall linear infinite;
            pointer-events: none;
            z-index: 1;
        }
        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <!-- 星星背景 -->
    <div class="star">✨</div>
    <div class="star">✨</div>
    <div class="star">✨</div>
    <div class="star">✨</div>
    <div class="star">✨</div>
    <div class="star">✨</div>
    <div class="star">✨</div>
    <div class="star">✨</div>
    <div class="star">✨</div>
    <div class="star">✨</div>

    <!-- 樱花花瓣 -->
    <div class="petal">🌸</div>
    <div class="petal">🌸</div>
    <div class="petal">🌸</div>
    <div class="petal">🌸</div>
    <div class="petal">🌸</div>
    <div class="petal">🌸</div>
    <div class="petal">🌸</div>
    <div class="petal">🌸</div>

    <div class="container">
        <h1>🌸 欢迎来到我的个人主页 🌸</h1>

        <!-- 关于我 -->
        <div class="card">
            <h2><span class="emoji">✨</span>关于我</h2>
            <p>你好呀～我是田雪滢，是一个热爱生活、喜欢记录日常的人～</p>
            <img src="self.jpg" alt="个人照片">
        </div>

        <!-- 兴趣爱好 -->
        <div class="card">
            <h2><span class="emoji">🎨</span>兴趣爱好</h2>

            <p>喜欢画画 ✏️</p>
            <img src="hobby2.png" alt="画画图片">

            <p>除了画画，我还喜欢拍照和cosplay，以及吃好吃的美食~生活里的小美好都想收集起来 💖</p>
            <img src="hobby1.jpg" alt="爱好图片">
        </div>

    </div>

    <script>
        // 随机位置 + 随机动画时长（星星）
        const stars = document.querySelectorAll('.star');
        stars.forEach(star => {
            star.style.left = Math.random() * 100 + 'vw';
            star.style.animationDelay = Math.random() * 2 + 's';
            star.style.fontSize = (Math.random() * 10 + 8) + 'px';
        });

        // 随机位置 + 随机下落速度（花瓣）
        const petals = document.querySelectorAll('.petal');
        petals.forEach(petal => {
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.animationDuration = (Math.random() * 5 + 5) + 's';
            petal.style.fontSize = (Math.random() * 10 + 15) + 'px';
        });
    </script>
</body>
</html>
